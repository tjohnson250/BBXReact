# Black Box Experiment Configuration
# -----------------------------------
# This config mirrors the settings available in the React UI.
# Results are exported in the same JSON format for cross-model comparison.

# API keys (can also be set via environment variables)
# Environment variables take precedence: OPENAI_API_KEY, GOOGLE_API_KEY, DEEPSEEK_API_KEY
api_keys:
  openai: ""        # or set OPENAI_API_KEY env var
  google: ""        # or set GOOGLE_API_KEY env var
  deepseek: ""      # or set DEEPSEEK_API_KEY env var

# Experiment settings
experiment:
  task_mode: predict    # "predict" or "play"
  prompt_style: augmented  # "baseline" or "augmented"
  include_visualization: true
  allow_hypotheses: false   # play mode only
  enable_thinking: true     # provider-specific reasoning/thinking
  thinking_budget: 10000    # token budget for thinking (Anthropic/Gemini)

  # Visualization of Thinking (VoT) prompt additions
  vot:
    grid_state: false    # Option A - play modes only
    ray_trace: false     # Option B - all modes
    hypothesis: false    # Option C - play modes only

  # Which atom configurations to test (0-indexed, 0-9 available)
  config_indices: [0, 1, 2, 3, 4]

  # Models to test - provider is inferred from model ID
  # Supported providers: openai, google, deepseek
  models:
    - id: o3
      name: "o3"
      provider: openai
    - id: o4-mini
      name: "o4-mini"
      provider: openai
    - id: gemini-2.5-pro
      name: "Gemini 2.5 Pro"
      provider: google
    - id: deepseek-reasoner
      name: "DeepSeek R1"
      provider: deepseek

# Rate limiting
rate_limit:
  delay_between_calls_ms: 500    # ms between API calls
  max_retries: 3                  # retries on transient errors
  backoff_base_ms: 1000           # base for exponential backoff
  backoff_max_ms: 30000           # max backoff delay

# Output settings
output:
  directory: "./results"           # where to save result JSON files
  include_html_report: false       # also generate HTML report
  log_file: "./results/experiment.log"
